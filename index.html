<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Portfolio</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen p-3 md:p-8 flex flex-col justify-center selection:bg-emerald-500 selection:text-slate-900">

    <div class="fixed inset-0 bg-[linear-gradient(to_right,#1e293b10_1px,transparent_1px),linear-gradient(to_bottom,#1e293b10_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

    <div class="max-w-5xl w-full mx-auto bg-slate-950/80 backdrop-blur-xl rounded-xl border border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden z-10 animate__animated animate__fadeIn">
        
        <div class="bg-slate-900 px-4 py-3 flex items-center border-b border-slate-800 space-x-2">
            <div class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.5)]"></div>
            <div class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
            <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[600px] relative">
            
            <aside class="lg:col-span-3 bg-slate-950 p-4 border-b lg:border-b-0 lg:border-r border-slate-800 font-mono text-sm flex flex-col justify-between">
                <div class="space-y-3 mb-6">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider select-none"><h2>Сердюк Андрей, 26 лет, г. Санкт-Петербург</h2></div>
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider select-none"><h3>Контакты:</h3></div>
                    <a href="https://t.me/qcandrey" target="_blank" class="flex items-center gap-2 text-xs text-slate-400 hover:text-emerald-400 transition-colors cursor-pointer">
                        <i class="fa-brands fa-telegram text-base text-sky-400"></i> - Связаться в Telegram
                    </a>
                    <a href="https://max.ru/u/f9LHodD0cOKd4D3k_exmUDJryYDcthmGFF-y8Nvh7JLwPWbe08CS5S6qUcc" target="_blank" class="flex items-center gap-2 text-xs text-slate-400 				hover:text-emerald-400 transition-colors cursor-pointer">
                        <i class="fa-brands fa-telegram text-base text-sky-400"></i><br> - Связаться в МАХ
                    </a>

                </div>

                <div class="space-y-4 pt-6 border-t border-slate-900 lg:border-t-0">
                    <div class="text-slate-500 uppercase tracking-wider text-xs font-bold select-none"><h3>Навигация</h3></div>
                    <ul class="space-y-2">
                        <li>
                            <button onclick="switchTab('profile')" id="btn-profile" class="nav-btn">
                                <span class="btn-title"><i class="fa-solid fa-braces btn-icon"></i> profile.json</span>
                                <span class="btn-arrow">&lt;-</span>
                            </button>
                        </li>
                        <li>
                            <button onclick="switchTab('skills')" id="btn-skills" class="nav-btn">
                                <span class="btn-title"><i class="fa-solid fa-braces btn-icon"></i> skills.json</span>
                                <span class="btn-arrow">&lt;-</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="lg:col-span-9 p-6 bg-slate-900/40 flex flex-col justify-between relative pb-12">
                <div class="mb-6 font-mono relative sm:pr-40 min-h-[128px]">
                    <div>
                        <span class="text-slate-500">$</span> <span class="text-slate-300">cat ./</span><span id="current-file" class="text-emerald-400 font-bold">profile.json</span>
                        <h1 class="text-xl md:text-2xl font-bold text-white mt-2 cursor-blink">Описание:</h1>
                    </div>
                    <div class="hidden sm:block rounded-lg bg-slate-950 border border-slate-800 p-1 shadow-[0_0_15px_rgba(16,185,129,0.05)] hover:border-emerald-500/50 transition-all duration-300 overflow-hidden" style="position: absolute; right: 0; top: 0; width: 256px; height: 256px; z-index: 20;">
                        <img src="photo.jpg" alt="Photo" class="rounded-md opacity-80 hover:opacity-100 transition-opacity grayscale hover:grayscale-0 duration-300" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>

                <pre id="json-display" class="flex-grow bg-slate-950/90 p-4 md:p-6 rounded-lg border border-slate-800 text-xs md:text-sm leading-relaxed overflow-x-auto min-h-[350px] neon-border font-mono whitespace-pre-wrap"></pre>

                <div class="absolute right-6 bottom-4 text-[11px] font-mono text-slate-600 select-none tracking-wide">
                    © 2026 // Веб версия резюме
                </div>
            </main>
        </div>
    </div>

    <script>
        let cachedData = null;
        const tabs = ['profile', 'skills'];

        function syntaxHighlight(json) {
            if (typeof json !== 'string') json = JSON.stringify(json, undefined, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|\b-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?\b)/g, function (match) {
                let cls = 'j-str';
                if (/^"/.test(match)) cls = /:$/.test(match) ? 'j-key' : 'j-str';
                else if (/true|false|null/.test(match)) cls = 'j-num';
                return cls === 'j-key' ? `<span class="${cls}">${match.slice(0, -1)}</span><span class="j-punc">:</span>` : `<span class="${cls}">${match}</span>`;
            });
        }

        function switchTab(tabName) {
            if (!cachedData) return;
            document.getElementById('current-file').innerText = tabName + '.json';
            
            const display = document.getElementById('json-display');
            display.classList.remove('animate__animated', 'animate__fadeIn');
            display.innerHTML = syntaxHighlight(cachedData[tabName]);
            setTimeout(() => display.classList.add('animate__animated', 'animate__fadeIn'), 10);

            // Переключаем кастомный дата-атрибут активности
            tabs.forEach(item => {
                const btn = document.getElementById('btn-' + item);
                if (item === tabName) btn.setAttribute('data-active', 'true');
                else btn.removeAttribute('data-active');
            });
        }

        window.onload = async () => {
            try {
                const response = await fetch('data.json');
                cachedData = await response.json();
                switchTab('profile');
            } catch (error) {
                document.getElementById('json-display').innerHTML = `<span class="text-rose-500">Ошибка загрузки data.json.</span>`;
            }
        };
    </script>
</body>
</html>
